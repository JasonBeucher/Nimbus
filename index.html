  const a = target?.closest('a.card, a.t10');
  return a?.closest('.poster, .large, .discover, .top10') ? a : null;
}

function followPeekCard() {
  if (!peekCard?.isConnected) return false;
  const card = peekCard.matches('.card') ? peekCard : peekCard.querySelector('.card');
  if (!card) return false;
  const r = card.getBoundingClientRect();
  const left = peekRow || peekGrid ? r.left : Math.max(16, Math.min(r.left, innerWidth - 16 - parseFloat(peek.style.width)));
  Object.assign(peek.style, { top: `${r.top}px`, left: `${left}px` });
  const target = peekPointer && document.elementFromPoint(peekPointer.x, peekPointer.y);
  // The poster is still a valid hover target while the landscape panel is revealing it.
  return !!target && (peek.contains(target) || peekCard.contains(target));
}

function trackPeekPointer(e) {
  if (!canPeek.matches || e.pointerType !== 'mouse') return;
  peekPointer = { x: e.clientX, y: e.clientY };
  if (peek.contains(e.target)) return;
  const a = peekAnchor(e.target);
  if (a === peekCard) return;
  closePeek();
  if (!a) return;
  peekCard = a;
  warmPeek(peekItems.get(a.getAttribute('href')), 'high');
  peekTimer = setTimeout(() => peekCard === a && openPeek(a), 450);
}

addEventListener('pointerover', trackPeekPointer);
addEventListener('pointermove', trackPeekPointer);
addEventListener('pointerout', (e) => {
  if (e.relatedTarget) return;
  peekPointer = null;
  closePeek();
});
peek.addEventListener('pointerleave', (e) => !peekCard?.contains(e.relatedTarget) && closePeek());
// Follow the card while scrolling; keep the same panel as long as the pointer remains over it.
addEventListener('scroll', (e) => {
  if (peek.classList.contains('open') && followPeekCard()) return;
  closePeek();
  if (!canPeek.matches || !peekPointer) return;
  // Scroll may arrive after pointerover. Recheck the card once it settles, even if the mouse stays still.
  peekTimer = setTimeout(() => {
    if (!peekPointer) return;
    const a = peekAnchor(document.elementFromPoint(peekPointer.x, peekPointer.y));
    if (!a) return;
    peekCard = a;
    warmPeek(peekItems.get(a.getAttribute('href')), 'high');
    openPeek(a);
  }, 450);
}, { capture: true, passive: true });
addEventListener('hashchange', closePeek);
addEventListener('resize', closePeek);

const icon = {
  info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4v16l14-8z"/></svg>',
  check: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  trailer: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>',
};

// One page for both: Jellyfin titles and TMDB discoveries, both can be marked watched.
async function renderDetail(api) {
  const pageHash = location.hash;
  $view.innerHTML = `<div class="state">Chargement…</div>`;
  let d;
  try {
    const res = await fetch(api);
    if (!res.ok) throw new Error((await res.json()).error);
    d = await res.json();
  } catch (e) {
    if (location.hash !== pageHash) return;
    $view.innerHTML = `<div class="state">Titre introuvable.<br><small>${esc(e.message)}</small><br><br><a class="btn" href="#/">Retour</a></div>`;
    return;
  }
  if (location.hash !== pageHash) return;
  if (d.owned) return location.replace(`#/titre/${d.owned}`); // a "discovery" you already have
  const show = d.type === 'show';
  const app = show ? 'Sonarr' : 'Radarr';
  const tmdbId = d.tmdbId || d.tmdb;
  const addLabel = d.requested ? 'Déjà demandé' : d.canAdd ? `Ajouter à ${app}` : `${app} non configuré`;
  const realSeasons = show ? d.seasons.filter((x) => x.index > 0).length : 0;
  const facts = [show ? d.years : d.year, show ? (realSeasons ? `${realSeasons} saison${realSeasons > 1 ? 's' : ''}` : '') : d.minutes && fmt(d.minutes), d.genres.join(', ')].filter(Boolean).join(' • ');
  // Play button: resume the movie, or the series' next episode.
  const resume = show ? d.next : d.progress ? { progress: d.progress, remaining: d.remaining } : null;
  const started = resume?.progress;
  const playLabel = `${started ? 'Continuer' : 'Lecture'}${show && d.next && d.next.label !== 'S1:É1' ? ` ${d.next.label}` : ''}`;
  const tabs = [show && ['episodes', 'Épisodes'], d.suggestions.length && ['suggestions', 'Suggestions'], d.canCheckReleases && ['versions', 'Versions'], ['details', 'Détails']].filter(Boolean);
  const dl = (rows) => `<dl>${rows.filter(([, v]) => v && v.length).map(([k, v]) => `<dt>${k} :</dt>${[].concat(v).map((x) => `<dd>${esc(x)}</dd>`).join('')}`).join('')}</dl>`;

  $view.innerHTML = `<article class="detail">
    <div class="detail-bg">${d.art ? `<img src="${d.art}" alt="" fetchpriority="high">` : ''}</div>
    <div class="detail-head">
      ${d.logo ? `<img class="detail-logo" src="${d.logo}" alt="${esc(d.title)}">` : ''}<h1 ${d.logo ? 'class="sr-only"' : ''}>${esc(d.title)}</h1>
      <div class="meta">${d.rating ? `<span class="badge">${esc(d.rating)}</span>` : ''}<span>${esc(facts)}</span></div>
      ${d.summary ? `<p class="detail-sum">${esc(d.summary)}</p>` : ''}
      ${started ? `<div class="detail-progress"><span class="bar"><i style="width:${Math.round(started * 100)}%"></i></span><span>${show ? `${esc(d.next.label)} · ` : ''}${resume.remaining ? `Il reste ${fmt(resume.remaining)}` : ''}</span></div>` : ''}
      <div class="detail-actions">
        ${!d.discover
          ? `<a class="btn play-btn" href="#/lecture/${d.key}">${icon.play}${esc(playLabel)}</a>`
          : d.requested ? '' : `<button class="btn play-btn" data-act="add" ${d.canAdd ? '' : 'disabled'}>${icon.plus}${esc(addLabel)}</button>`}
        <button class="watched-btn" data-act="watched" aria-pressed="${!!d.watched}" title="${d.watched ? 'Retirer le statut vu' : 'Marquer comme vu'}">${icon.check}<span>J’ai vu</span></button>
        ${d.trailer ? `<a class="round" href="${esc(d.trailer)}" target="_blank" rel="noopener noreferrer" aria-label="Bande-annonce (nouvel onglet)" title="Bande-annonce">${icon.trailer}</a>` : ''}
      </div>
      ${d.discover ? '<p class="detail-msg acq-msg" role="status"></p>' : ''}
      ${tmdbId && (d.canAdd || !d.discover) ? `<div class="acq" hidden>
        <div class="acq-line"><strong class="acq-label" role="status"></strong><span class="acq-pct"></span></div>
        <div class="bar" aria-hidden="true"><i></i></div>
        <progress class="sr-only" max="100" aria-label="Progression du téléchargement"></progress>
        <div class="acq-meta"></div>

    ${show ? `<section class="panel" id="panel-episodes" role="tabpanel" aria-labelledby="tab-episodes">

          <div><h3>Versions sur tes indexeurs</h3><p class="versions-status" role="status" aria-live="polite">Interroge tes indexeurs pour voir les versions de ce film. Rien n’est téléchargé tant que tu n’en choisis pas une.${d.discover && !d.requested ? ' S’il n’est pas encore dans Radarr, il y sera ajouté, sans surveillance.' : ''}</p></div>

  observePeekCards();

  // Tabs: click or arrow keys.
  const tabBtns = [...$view.querySelectorAll('[role=tab]')];

  });

  // ---- Downloads (Radarr/Sonarr) and versions on the indexers (Radarr) ----
  const add = $view.querySelector('[data-act=add]');
  const acq = $view.querySelector('.acq');
  const kind = d.kind || (show ? 'tv' : 'movie');
  const JSON_POST = { method: 'POST', headers: { 'Content-Type': 'application/json' } };
  const live = new Set();
  let stopped = false, busy = false, timer, lastStatus;

  leaveDownloads = () => { stopped = true; clearTimeout(timer); live.forEach((c) => c.abort()); };
  const bytes = (n) => (n >= 1024 ** 3 ? `${(n / 1024 ** 3).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} Go` : `${(n / 1024 ** 2).toLocaleString('fr-FR', { maximumFractionDigits: 0 })} Mo`);
  const rate = (n) => {
    const [unit, div] = [['Go/s', 1024 ** 3], ['Mo/s', 1024 ** 2], ['Ko/s', 1024]].find(([, v]) => n >= v) || ['o/s', 1];
    return `${(n / div).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} ${unit}`;
  };

  const ACTIVE = ['queued', 'downloading', 'paused', 'importing', 'blocked'];
  const LABELS = { waiting: 'Recherche d’une source', queued: 'En file d’attente', downloading: 'Téléchargement en cours', paused: 'Téléchargement en pause', importing: 'Ajout à la médiathèque', blocked: 'Intervention requise', ready: show ? 'Épisodes téléchargés' : 'Téléchargement terminé', unavailable: 'Suivi indisponible' };
  const repairBtn = acq?.querySelector('[data-act=repair]');
  const repairBox = acq?.querySelector('.acq-repair');
  let repairBusy = false;
  const syncRepair = () => {
    if (!repairBtn) return;
    const s = lastStatus || {};
    repairBtn.hidden = !s.canRepair && !s.repair?.pending;
    repairBtn.disabled = repairBusy || !!s.repair?.pending;
    repairBtn.textContent = repairBusy ? 'Analyse…' : s.repair?.pending ? 'Import en cours…' : 'Résoudre le blocage';
    if (s.state === 'ready') repairBox.hidden = true;
    if (s.repair?.failed) {
      repairBox.hidden = false;

  };
  const showStatus = (s) => {
    lastStatus = s;
    // A title already in Jellyfin only shows this while something is actually happening.
    if (!d.discover && !ACTIVE.includes(s.state) && !s.repair?.pending) return (acq.hidden = true);
    acq.hidden = false;
    acq.dataset.state = s.state;
    const pct = s.state === 'ready' ? 100 : s.progress == null ? null : Math.floor(s.progress * 100);
    // An unknown size must never look like 0 % or 100 %.
    acq.dataset.indeterminate = String(pct == null && s.state !== 'unavailable');
    acq.querySelector('.acq-label').textContent = LABELS[s.state] || '';
    acq.querySelector('.acq-pct').textContent = pct == null ? '' : `${pct} %`;
    acq.querySelector('.bar i').style.setProperty('--p', (pct ?? 0) / 100);
    const progress = acq.querySelector('progress');
    if (pct == null) progress.removeAttribute('value');
    else progress.value = pct;
    let eta = '';
    if (s.eta) {
      const m = Math.max(1, Math.ceil((s.eta - Date.now()) / 60_000));
      eta = `encore ≈ ${m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`}`;
    }
    const speed = Number.isFinite(s.speed) && s.speed >= 0 ? `${s.speedSource === 'estimated' ? '≈ ' : ''}${rate(s.speed)}` : '';
    acq.querySelector('.acq-meta').textContent = [s.size > 0 && s.progress != null ? `${bytes(s.size - s.remaining)} sur ${bytes(s.size)}` : '', speed, eta].filter(Boolean).join(' · ');
    const NOTES = {
      waiting: 'Le téléchargement démarrera dès qu’une source sera trouvée.',
      queued: 'Le téléchargement va bientôt démarrer.',
      paused: 'La progression reprendra avec le téléchargement.',
      importing: 'Encore un instant avant de le retrouver dans Jellyfin.',
      blocked: show ? 'Sonarr attend une vérification avant d’ajouter les épisodes à la médiathèque.' : 'Radarr attend une vérification avant d’ajouter le fichier à la médiathèque.',
      ready: show ? `${s.files} épisode${s.files > 1 ? 's' : ''} récupéré${s.files > 1 ? 's' : ''}.` : 'Il apparaîtra dans ta médiathèque après l’analyse de Jellyfin.',
      unavailable: `${app} ne répond pas. Nouvel essai dans quelques secondes.`,
    };
    acq.querySelector('.acq-note').textContent = [s.count > 1 ? `${s.count} téléchargements` : '', NOTES[s.state]].filter(Boolean).join(' · ');
    // Radarr says "Manual Import required", Sonarr "matched to series by ID": both mean the file needs a check.
    const explain = (m) => (/manual import required|matched to (movie|series) by id/i.test(m)
      ? (show ? 'Sonarr a reconnu la série mais demande de vérifier les fichiers avant de les importer.' : 'Radarr a reconnu le film mais demande de vérifier le fichier avant de l’importer.') : m);
    acq.querySelector('.acq-issues').innerHTML = s.state === 'blocked' ? [...new Set((s.issues || []).map(explain))].map((m) => `<li>${esc(m)}</li>`).join('') : '';

  const poll = async () => {
    clearTimeout(timer);

        if (!res.ok) throw new Error('unavailable');

      }
    } catch (e) {
      if (stopped || e.name === 'AbortError') return;

    timer = setTimeout(poll, 5000);

  if (acq && (d.requested || !d.discover)) poll();

  if (repairBtn) repairBtn.onclick = async () => {
    const intro = repairBox.querySelector('.acq-repair-intro');
    const msg = repairBox.querySelector('.acq-repair-msg');
    const form = repairBox.querySelector('form');
    repairBusy = true;
    repairBox.hidden = false;

    msg.textContent = 'Analyse des fichiers téléchargés…';
    form.hidden = true;

    try {
      const res = await call(`/api/downloads/${kind}/${tmdbId}/repair`, { ...JSON_POST, body: '{}' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Analyse impossible.');
      if (stopped) return;
      const ok = data.files.filter((f) => f.selection);
      // A season pack holds several episodes: they can all go in one import.
      const many = data.single === false;
      const submitLabel = (n) => (n > 1 ? `Importer ces ${n} fichiers` : 'Importer ce fichier');
      intro.textContent = data.message;
      msg.textContent = !data.files.length ? `Aucun fichier à importer. Corrige le dossier ou les permissions dans ${app}, puis relance l’analyse.`
        : !ok.length ? `${app} refuse ces fichiers pour les raisons indiquées. Corrige-les dans ${app}, puis relance l’analyse.` : '';
      form.innerHTML = data.files.length ? `<fieldset><legend>${many ? 'Fichiers à importer' : 'Fichier à importer'}</legend>${data.files.map((f) => `<label class="pick">
          <input type="${many ? 'checkbox' : 'radio'}" name="selection" value="${esc(f.selection || '')}" ${!f.selection ? 'disabled' : many ? 'checked' : `required ${ok.length === 1 ? 'checked' : ''}`}>
          <span>${f.episode ? `${esc(f.episode)}<small>${esc(f.name)}</small>` : esc(f.name)}<small>${[f.size > 0 ? bytes(f.size) : '', f.quality, f.languages.join(', ')].filter(Boolean).map(esc).join(' · ')}</small>${f.rejections.length ? `<small class="warn">${f.rejections.map(esc).join(' · ')}</small>` : ''}</span>
        </label>`).join('')}</fieldset><button class="btn" type="submit" style="margin-top:14px" ${ok.length ? '' : 'disabled'}>${submitLabel(many ? ok.length : 1)}</button>` : '';
      form.hidden = !data.files.length;
      form.onchange = () => {
        if (!many) return;
        const n = form.querySelectorAll('input:checked').length;
        const submit = form.querySelector('button');
        submit.disabled = !n;
        submit.textContent = submitLabel(n || 1);
      };
      form.onsubmit = async (e) => {
        e.preventDefault();
        const picked = [...form.querySelectorAll('input:checked')].map((i) => i.value);
        if (!picked.length || repairBusy) return;
        repairBusy = true;
        form.querySelector('fieldset').disabled = form.querySelector('button').disabled = true;
        msg.textContent = `Envoi de l’import à ${app}…`;

          const r = await call(`/api/downloads/${kind}/${tmdbId}/import`, { ...JSON_POST, body: JSON.stringify({ selection: many ? picked : picked[0] }) });
          const result = await r.json();

          if (!stopped) syncRepair();
        }

      if (!stopped) syncRepair();

  if (add) add.onclick = async () => {

    add.lastChild.textContent = 'Envoi…';
    msg.textContent = '';
    const res = await call('/api/request', { ...JSON_POST, body: JSON.stringify({ kind: d.kind, tmdbId: d.tmdbId }) }).catch(() => null);
    busy = false;
    if (stopped) return;
    if (res?.ok) {
      d.requested = true;
      add.remove();
      if (acq) { showStatus({ state: 'waiting' }); poll(); } else msg.textContent = `Ajouté à ${app}.`;
    } else {
      add.disabled = false;
      add.lastChild.textContent = addLabel;
      msg.textContent = (await res?.json().catch(() => null))?.error || 'Échec de l’envoi. Réessaie.';
    }
  };

  const vp = $view.querySelector('.versions');
  if (vp) {
    const search = vp.querySelector('[data-act=releases]');

    const chips = vp.querySelector('.chips');
    const notes = vp.querySelector('.versions-notes');
    const list = vp.querySelector('.version-list');
    const more = vp.querySelector('.versions-more');
    const msg = vp.querySelector('.versions-msg');
    const foot = vp.querySelector('.versions-foot');
    const LANG = { French: 'Français', English: 'Anglais', German: 'Allemand', Italian: 'Italien', Spanish: 'Espagnol', Japanese: 'Japonais', Unknown: 'Langue inconnue' };

    // Radarr's quality can omit the resolution (BR-DISK…): the release name usually has it.
    const format = (r) => {
      const t = `${r.quality} ${r.title}`;

    };

    const draw = () => {

      const best = data.items.find((r) => r.accepted);

        ${format(r) ? `<span class="badge version-res">${format(r)}</span>` : '<span></span>'}

          <div class="version-q">${esc(r.quality)}${r === best ? '<span class="version-best">Premier choix de Radarr</span>' : ''}</div>
          <div class="version-meta">${esc([r.languages.map((l) => LANG[l] || l).join(', ') || 'Langue inconnue', r.indexer, r.seeders == null ? '' : plural(r.seeders, 'source')].filter(Boolean).join(' · '))}</div>
          <div class="version-name" title="${esc(r.title)}">${esc(r.title)}</div>

          <span class="version-size">${r.size == null ? '—' : bytes(r.size)}</span>

            : r.sent ? `<span class="version-state ok">${icon.check}Envoyée</span>` : `<span class="version-state">${r.accepted ? 'Compatible' : 'Non retenue'}</span>`}
        </div>

      </li>`).join('');

    };

      vp.setAttribute('aria-busy', 'true');
      status.textContent = 'Tes indexeurs sont interrogés. Cela peut prendre une à deux minutes.';
      chips.hidden = notes.hidden = more.hidden = true;
      msg.textContent = foot.textContent = '';
      list.innerHTML = '<li class="version version-skel" aria-hidden="true"><i class="skeleton"></i><i class="skeleton"></i><i class="skeleton"></i></li>'.repeat(3);
      try {
        const res = await call(`/api/releases/movie/${tmdbId}`, { ...JSON_POST, body: '{}' });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Recherche indisponible. Réessaie.');
        if (stopped) return;
        data = json;
        filter = data.accepted ? 'accepted' : 'all';
        limit = 30;
        const profile = data.profile ? ` (profil ${data.profile})` : '';
        status.textContent = !data.total ? 'Aucune version trouvée pour le moment. Un résultat vide ne garantit pas que le film est introuvable.'
          : data.accepted ? `${plural(data.accepted, 'version')} compatible${data.accepted > 1 ? 's' : ''} sur ${data.total} trouvée${data.total > 1 ? 's' : ''}${profile}.`
          : data.alternatives ? `${plural(data.alternatives, 'alternative')} sur ${data.total} version${data.total > 1 ? 's' : ''} trouvée${data.total > 1 ? 's' : ''}${profile} : Radarr en a déjà une en file.`
          : `Aucune version compatible sur les ${data.total} trouvées${profile}. Chaque version indique pourquoi Radarr l’écarte.`;
        notes.innerHTML = data.warnings.map((w) => `<li>${esc(w)}</li>`).join('');
        notes.hidden = !data.warnings.length;
        chips.querySelector('[data-filter=accepted] span').textContent = data.accepted;
        chips.querySelector('[data-filter=accepted]').disabled = !data.accepted;
        chips.querySelector('[data-filter=all] span').textContent = data.total;
        chips.hidden = !data.total;
        draw();
        foot.textContent = `Vérifié à ${new Date(data.checkedAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}.`;
      } catch (e) {
        if (stopped || e.name === 'AbortError') return;
        status.textContent = e.message;
        list.innerHTML = '';
        data = null;
      } finally {
        busy = false;
        if (!stopped) {
          search.disabled = false;
          search.querySelector('span').textContent = data ? 'Relancer' : 'Rechercher';
          vp.setAttribute('aria-busy', 'false');
        }
      }
    };
    search.onclick = check;
    chips.onclick = (e) => {

      limit = 30;
      draw();
    };
    more.onclick = () => { limit += 30; draw(); };
    list.onclick = async (e) => {
      const b = e.target.closest('[data-selection]');
      if (!b || busy || !data) return;
      const item = data.items.find((r) => r.selection === b.dataset.selection);
      if (!item) return;
      busy = search.disabled = true;
      if (add) add.disabled = true;
      sending = item.selection;
      msg.textContent = '';
      draw();
      try {
        const res = await call(`/api/releases/movie/${tmdbId}/download`, { ...JSON_POST, body: JSON.stringify({ selection: sending }) });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Impossible de télécharger cette version.');
        if (stopped) return;
        item.sent = true;
        item.selection = null;
        d.requested = true;
        add?.remove();
        msg.textContent = `${result.message} ${result.title}${result.warning ? ` · ${result.warning}` : ''}`;

      } finally {

        sending = null;

  }

  const watched = $view.querySelector('[data-act=watched]');
  if (watched) watched.onclick = async () => {
    const on = watched.getAttribute('aria-pressed') !== 'true';
    const msg = watched.closest('.detail-head').querySelector('.watched-msg');

    watched.disabled = true;

    watched.disabled = false;
    if (res?.ok) {
      d.watched = on;
      watched.setAttribute('aria-pressed', on);
      watched.title = on ? 'Retirer le statut vu' : 'Marquer comme vu';
      msg.textContent = on ? 'Marqué comme vu.' : 'Statut vu retiré.';
    } else {
      msg.textContent = (await res?.json().catch(() => null))?.error || 'Impossible d’enregistrer le statut vu. Réessaie.';
    }
  };

  if (!show) return;
  const grid = $view.querySelector('.grid.episodes');
  const seasons = new Map();
  const load = async (seasonId) => {
    if (!seasonId) return (grid.innerHTML = '<p class="state">Aucun épisode.</p>');
    grid.innerHTML = '';
    const url = d.discover ? `/api/discover/season/${d.tmdbId}/${seasonId}` : `/api/episodes/${d.key}/${seasonId}`;
    if (!seasons.has(seasonId)) seasons.set(seasonId, fetch(url).then((r) => r.json()));
    const eps = await seasons.get(seasonId);
    grid.innerHTML = eps.map((e) => {
      const name = `${e.index != null ? `${e.index}. ` : ''}${e.name}`;
      const pic = e.still ? `<img src="${e.still}" alt="" loading="lazy">` : `<span class="fallback">${esc(name)}</span>`;
      return `<div>
        ${d.discover ? `<div class="card static">${pic}</div>` : `<a class="card" href="#/lecture/${e.id}" aria-label="Lire ${esc(name)}">${pic}
          <span class="play"><svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#fff"/><path d="M15 12v16l13-8z" fill="#0b1020"/></svg></span>
          ${e.progress ? `<span class="progress"><i style="width:${Math.round(e.progress * 100)}%"></i></span>` : ''}
        </a>`}
        <div class="cw-meta"><div class="t">${esc(name)}</div>${e.summary ? `<p class="ep-sum">${esc(e.summary)}</p>` : ''}${e.minutes ? `<div class="left">(${e.minutes} min)</div>` : ''}</div>
      </div>`;
    }).join('') || '<p class="state">Aucun épisode.</p>';
  };
  $view.querySelector('.season-select')?.addEventListener('change', (e) => load(e.target.value));
  load(d.season);
}

const LISTS = [['foryou', 'Pour toi'], ['trending', 'Tendances'], ['popular', 'Populaires'], ['top', 'Cultes'], ['new', 'Nouveautés'], ['upcoming', 'À venir']];
const KINDS = [['all', 'Tout'], ['movie', 'Films'], ['tv', 'Séries']];
const genreLists = {};

function renderDiscover(query) {
  const p = new URLSearchParams(query);
  const st = {
    kind: KINDS.some(([k]) => k === p.get('kind')) ? p.get('kind') : 'all',
    // No list = the streaming-style home (banner + rows); a list = its full grid ("Voir tout").
    list: LISTS.some(([k]) => k === p.get('list')) ? p.get('list') : '',
    genre: /^\d+$/.test(p.get('genre') || '') ? p.get('genre') : '',
    q: (p.get('q') || '').slice(0, 100),
  };
  $view.innerHTML = `<div class="filters">
      <div class="seg" role="group" aria-label="Type">${KINDS.map(([k, t]) => `<button data-kind="${k}">${t}</button>`).join('')}</div>
      <select class="season-select" aria-label="Genre" hidden><option value="">Tous les genres</option></select>
      <label class="search-pill">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
        <input type="search" placeholder="Film ou série" aria-label="Rechercher un film ou une série à découvrir" autocomplete="off" value="${esc(st.q)}">
        <button class="clear" type="button" aria-label="Effacer la recherche" ${st.q ? '' : 'hidden'}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </label>
    </div>
    <div class="filters" data-grid-head hidden>
      <a class="back-link" href="#/decouvrir">Découvrir</a>
      <div class="chips" role="group" aria-label="Liste">${LISTS.map(([k, t]) => `<button data-list="${k}">${t}</button>`).join('')}</div>
    </div>
    <div class="rows-area"></div>
    <div class="grid discover" aria-live="polite" hidden></div>
    <p class="state" hidden></p>
    <div class="more"></div>`;
  const input = $view.querySelector('input');
  const clear = $view.querySelector('.clear');
  const head = $view.querySelector('[data-grid-head]');
  const rowsArea = $view.querySelector('.rows-area');
  const grid = $view.querySelector('.grid');
  const note = $view.querySelector('.state');
  const genre = $view.querySelector('select');
  const sentinel = $view.querySelector('.more');
  let page = 0, more = true, busy = false, run = 0;
  const shown = new Set(); // TMDB pages overlap when its ranking shifts between two requests
  const gridMode = () => !!(st.q || st.list);

  const sync = async () => {
    // Keep the filters in the address so "back" from a title lands on the same view.
    const qs = new URLSearchParams(Object.entries(st).filter(([k, v]) => v && !(k === 'kind' && v === 'all')));
    history.replaceState(null, '', `#/decouvrir${qs.size ? `?${qs}` : ''}`);
    $view.querySelectorAll('[data-kind]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.kind === st.kind));
    $view.querySelectorAll('[data-list]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.list === st.list));
    head.hidden = !st.list || !!st.q;
    head.querySelector('.back-link').href = `#/decouvrir${st.kind !== 'all' ? `?kind=${st.kind}${st.genre ? `&genre=${st.genre}` : ''}` : ''}`;
    clear.hidden = !st.q;
    rowsArea.hidden = gridMode();
    grid.hidden = !gridMode();
    genre.hidden = st.kind === 'all' || !!st.q;
    if (!genre.hidden) {
      genreLists[st.kind] ??= fetch(`/api/discover/genres/${st.kind}`).then((r) => r.json()).catch(() => []);
      const list = await genreLists[st.kind];
      genre.innerHTML = `<option value="">Tous les genres</option>${list.map((g) => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}`;
      genre.value = st.genre;
    }
  };
  const loadRows = async () => {
    const mine = run;
    rowsArea.innerHTML = `<div class="hero"><div class="hero-track"><div class="slide active skeleton"></div></div></div>`;
    const qs = new URLSearchParams({ ...(st.kind !== 'all' && { kind: st.kind }), ...(st.genre && { genre: st.genre }) });
    try {
      const res = await fetch(`/api/discover/rows?${qs}`);
      const data = await res.json();
      if (mine !== run) return;
      if (!res.ok) throw new Error(data.error);
      clearInterval(heroTimer);
      rowsArea.innerHTML = hero(data.hero) + data.rows.map(row).join('');
      wire();
    } catch (e) {
      if (mine === run) rowsArea.innerHTML = `<p class="state">${esc(e.message || 'TMDB ne répond pas.')}</p>`;
    }
  };
  const load = async () => {
    if (!gridMode() || busy || !more || !document.body.contains(grid)) return;
    busy = true;
    const mine = run;
    const qs = new URLSearchParams({ kind: st.kind, list: st.list || 'trending', page: page + 1, ...(st.genre && { genre: st.genre }), ...(st.q && { q: st.q }) });
    try {
      const res = await fetch(`/api/discover/browse?${qs}`);
      const data = await res.json();
      if (mine !== run) return; // filters changed meanwhile
      if (!res.ok) throw new Error(data.error);
      page++;
      more = data.more;
      const fresh = data.items.filter((i) => !shown.has(i.key) && shown.add(i.key));
      grid.insertAdjacentHTML('beforeend', fresh.map((i) => card(i, 'discover')).join(''));
      observePeekCards();
      note.hidden = !!grid.children.length || more;
      note.textContent = st.q ? `Aucun résultat pour « ${st.q} ».`
        : st.list === 'foryou' ? "Pas encore de suggestions de l'IA ici. Lance-les depuis Réglages, elles arrivent en une minute environ."
        : 'Rien à découvrir ici : tu as déjà tout !';
    } catch (e) {
      more = false;
      note.hidden = false;
      note.textContent = e.message || 'TMDB ne répond pas.';
    } finally {
      if (mine === run) busy = false;
    }
    // A page made only of titles you own can come back empty: keep going while the bottom is in view.
    if (mine === run && more && sentinel.getBoundingClientRect().top < innerHeight + 600) load();
  };
  const reset = () => {
    run++;
    page = 0; more = true; busy = false;
    shown.clear();
    grid.innerHTML = '';
    note.hidden = true;
    sync();
    if (gridMode()) load();
    else loadRows();
  };
  $view.querySelector('.seg').onclick = (e) => {
    const b = e.target.closest('[data-kind]');
    if (!b || st.kind === b.dataset.kind) return;
    st.kind = b.dataset.kind;
    st.genre = '';
    reset();
  };
  head.querySelector('.chips').onclick = (e) => {
    const b = e.target.closest('[data-list]');
    if (!b || st.list === b.dataset.list) return;
    st.list = b.dataset.list;
    reset();
  };
  genre.onchange = () => { st.genre = genre.value; reset(); };
  let t;
  input.oninput = () => {
    clearTimeout(t);
    clear.hidden = !input.value;
    t = setTimeout(() => { st.q = input.value.trim(); reset(); }, 300);
  };
  clear.onclick = (e) => { e.preventDefault(); input.value = ''; st.q = ''; reset(); input.focus(); };
  new IntersectionObserver((entries) => entries[0].isIntersecting && load(), { rootMargin: '600px' }).observe(sentinel);
  reset();
}

function renderSearch() {
  $view.innerHTML = `<div class="search-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
      <input type="search" placeholder="Titre ou genre" aria-label="Rechercher un titre ou un genre" autocomplete="off">
      <button class="clear" aria-label="Effacer la recherche" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="results" aria-live="polite"></div>`;
  const input = $view.querySelector('input');
  const clear = $view.querySelector('.clear');
  const results = $view.querySelector('.results');
  let aiOn = false;
  fetch('/api/settings').then((r) => r.json()).then((s) => {
    aiOn = s.ai;
    if (aiOn) input.placeholder = 'Titre, genre… ou une envie';
  }).catch(() => {});
  const askButton = (q) => `<button class="ask" data-ask><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.2 6.8L21 9l-6.8 2.2L12 18l-2.2-6.8L3 9l6.8-2.2zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
    <span>Demander à Nimbus : « ${esc(q)} »<small>Des idées dans ta médiathèque et des titres à découvrir (Entrée)</small></span></button>`;

  // A sentence for the AI goes to the Nimbus page, which asks right away.
  const ask = () => {
    const q = input.value.trim();
    if (q && aiOn) location.hash = `#/nimbus?q=${encodeURIComponent(q)}`;
  };

  // Empty box: titled rows, then genre tiles that run a genre search (Disney+'s "Parcourir").
  let explore;
  const showExplore = async () => {
    explore ??= fetch('/api/explore').then((r) => r.json());
    const { rows, genres } = await explore;
    if (input.value.trim()) return;
    const tiles = genres.map((g) => `<button class="card genre" data-q="${esc(g.name)}">${g.art ? `<img src="${g.art}" alt="" loading="lazy">` : ''}<span>${esc(g.name)}</span></button>`).join('');
    results.innerHTML = rows.map(row).join('') + (genres.length ? row({ title: 'Parcourir par genre', style: 'wide', html: tiles }) : '');
    wire();
  };
  let t;
  const run = () => {
    clearTimeout(t);
    clear.hidden = !input.value;
    t = setTimeout(async () => {
      const q = input.value.trim();
      if (!q) return showExplore();
      const qs = encodeURIComponent(q);
      const [items, more] = await Promise.all([
        fetch(`/api/search?q=${qs}`).then((r) => r.json()),
        fetch(`/api/discover?q=${qs}`).then((r) => (r.ok ? r.json() : [])).catch(() => []),
      ]);
      if (q !== input.value.trim()) return; // a newer search is on its way
      results.innerHTML = (aiOn ? askButton(q) : '') + ((items.length ? `<div class="grid wide">${items.map((i) => card(i, 'wide')).join('')}</div>` : '')
        + (more.length ? `<h3 class="grid-title">À découvrir<small>Pas dans ta médiathèque : ouvre un titre pour l'envoyer vers Radarr ou Sonarr</small></h3>
          <div class="grid discover">${more.map((i) => card(i, 'discover')).join('')}</div>` : '')
        || `<p class="state">Aucun résultat pour « ${esc(q)} ».</p>`);
      observePeekCards();
    }, 200);
  };
  input.oninput = run;
  input.onkeydown = (e) => { if (e.key === 'Enter') ask(); }; // braces: an on* handler returning false blocks the key
  clear.onclick = () => { input.value = ''; run(); input.focus(); };
  results.onclick = (e) => {
    if (e.target.closest('[data-ask]')) return ask();
    const g = e.target.closest('[data-q]');
    if (!g) return;
    input.value = g.dataset.q;
    run();
    scrollTo(0, 0);
  };
  showExplore();
  input.focus();
}

// Nimbus page: a session of questions to the AI. The turns live here, so leaving and coming back keeps them.
const nimbus = { turns: [], art: null };
const NB_IDEAS = ['Un film qui fait peur, mais pas trop', 'Une série courte à finir ce week-end', 'Quelque chose de drôle à voir en famille', 'Un grand classique que je n\'ai pas vu'];
const NB_THINKING = ['Nimbus cherche des idées…', 'Il compare les ambiances…', 'Il vérifie les titres à découvrir…', 'Encore un instant…'];

function renderNimbus(query) {
  const first = (new URLSearchParams(query).get('q') || '').trim().slice(0, 300);
  if (query) history.replaceState(null, '', '#/nimbus'); // a reload must not ask again
  $view.innerHTML = `<div class="nb" data-state="${nimbus.turns.length || first ? 'chat' : 'idle'}">
      <div class="nb-wall" aria-hidden="true"></div>
      <div class="nb-hello">
        <h1>Qu'est-ce qui te ferait envie ce soir ?</h1>
        <p>Décris une humeur, une soirée, un film que tu aimes. Nimbus te propose des titres de ta médiathèque et d’autres à découvrir.</p>
      </div>
      <button class="nb-new glass" type="button">Nouvelle session</button>
      <div class="nb-thread" aria-live="polite"></div>
      <form class="nb-composer glass">
        <textarea rows="1" maxlength="300" placeholder="Un film qui fait peur, mais pas trop…" aria-label="Ta demande à Nimbus"></textarea>
        <button class="nb-send" type="submit" aria-label="Envoyer à Nimbus" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
      <div class="nb-ideas">${NB_IDEAS.map((i) => `<button class="glass" type="button">${esc(i)}</button>`).join('')}</div>
    </div>`;
  const root = $view.querySelector('.nb');
  const wall = root.querySelector('.nb-wall');
  const thread = root.querySelector('.nb-thread');
  const form = root.querySelector('form');
  const ta = form.querySelector('textarea');
  const sendBtn = form.querySelector('.nb-send');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pending = () => nimbus.turns.some((t) => t.pending);

  // Three lanes of posters, each repeated three times so the drift loops without a seam.
  nimbus.art ??= fetch('/api/art').then((r) => r.json()).catch(() => []);
  nimbus.art.then((list) => {
    if (!list.length || !root.isConnected) return;
    wall.innerHTML = [0, 1, 2].map((n) => {
      const lane = list.filter((_, k) => k % 3 === n);
      return `<div class="nb-lane"><div>${[...lane, ...lane, ...lane].map((src) => `<img src="${src}" alt="">`).join('')}</div></div>`;
    }).join('');
    requestAnimationFrame(() => wall.classList.add('ready'));
  });

  const sync = () => {
    sendBtn.disabled = !ta.value.trim() || pending();
    root.classList.toggle('busy', pending());
  };
  // The composer glides between the middle of the page and the bottom dock (View Transitions, where supported).
  const swap = (fn) => (document.startViewTransition && !reduced ? document.startViewTransition(fn) : fn());

  const answer = (t) => {
    if (t.pending) return `<div class="nb-think" role="status"><span class="nb-orb glass"></span><span class="nb-status">${NB_THINKING[0]}</span></div>`;
    if (t.error) return `<p class="nb-error">${esc(t.error)}<button class="nb-retry" type="button" data-retry>Réessayer</button></p>`;
    const cards = t.items.map((i, n) => card(i, 'wide', undefined, true).replace('<div>', `<div style="--i:${n}">`)).join('');
    return (t.intro ? `<p class="nb-intro">${esc(t.intro)}</p>` : '')
      + (t.notice ? `<p class="nb-notice">${esc(t.notice)}</p>` : '')
      + (cards ? `<div class="grid wide nb-results">${cards}</div>` : t.intro ? '' : `<p class="nb-intro">Aucun titre ne correspond assez bien à « ${esc(t.q)} ».</p>`);
  };
  const mount = (t, fresh) => {
    thread.insertAdjacentHTML('beforeend', `<section class="nb-turn${fresh ? ' fresh' : ''}"><p class="nb-q glass">${esc(t.q)}</p><div class="nb-a">${answer(t)}</div></section>`);
    t.el = thread.lastElementChild;
  };
  const settle = (t) => {
    if (!t.el?.isConnected) return; // the page was left; it shows the answer when it comes back
    const think = t.el.querySelector('.nb-think');
    const show = () => { t.el.classList.add('fresh'); t.el.querySelector('.nb-a').innerHTML = answer(t); sync(); };
    if (think && !reduced) { think.classList.add('leaving'); setTimeout(show, 280); } else show();
  };
  const run = async (t) => {
    t.pending = true;
    t.error = null;
    sync();
    try {
      const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: t.q, before: t.before }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      Object.assign(t, data);
    } catch (e) {
      t.error = e.message || 'Nimbus ne répond pas.';
    }
    t.pending = false;
    settle(t);
  };
  const send = (q) => {
    q = q.trim();
    if (!q || pending()) return;
    const t = { q, before: nimbus.turns.filter((x) => !x.error).map((x) => x.q).slice(-4) };
    beat = 0; // the waiting lines start over for each question
    nimbus.turns.push(t);
    t.pending = true;
    swap(() => { root.dataset.state = 'chat'; mount(t, true); });
    ta.value = '';
    run(t);
    requestAnimationFrame(() => t.el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }));
  };

  nimbus.turns.forEach((t) => mount(t, false));
  sync();
  // The waiting line changes every few seconds so a long search still feels alive.
  let beat = 0;
  const pulse = setInterval(() => {
    if (!root.isConnected) return clearInterval(pulse);
    beat++;
    root.querySelectorAll('.nb-status').forEach((s) => {
      s.textContent = NB_THINKING[Math.min(beat, NB_THINKING.length - 1)];
      s.classList.remove('tick');
      void s.offsetWidth; // restart the animation
      s.classList.add('tick');
    });
  }, 3200);

  ta.oninput = sync;
  ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } };
  form.onsubmit = (e) => { e.preventDefault(); send(ta.value); };
  root.querySelector('.nb-ideas').onclick = (e) => { const b = e.target.closest('button'); if (b) send(b.textContent); };
  root.querySelector('.nb-new').onclick = () => {
    if (pending()) return;
    nimbus.turns = [];
    swap(() => { root.dataset.state = 'idle'; thread.innerHTML = ''; });
    ta.focus();
  };
  thread.onclick = (e) => {
    if (!e.target.closest('[data-retry]')) return;
    const t = nimbus.turns.find((x) => x.el === e.target.closest('.nb-turn'));
    if (!t || pending()) return;
    t.pending = true;
    t.el.querySelector('.nb-a').innerHTML = answer(t);
    run(t);
  };
  if (first) send(first);
  else ta.focus();
}

          <p>${hint}</p>
          <div class="fields">
            <label>Route de l'API<input type="url" name="url" placeholder="http://192.168.1.89:8080/v1" autocomplete="off" spellcheck="false"></label>
            <label>Modèle<input name="model" list="models-${k}" autocomplete="off" spellcheck="false"><datalist id="models-${k}"></datalist></label>
            <label>Clé d'API<input type="password" name="key" autocomplete="off" placeholder="Aucune"></label>
            <label>Réflexion<select name="effort">${effortOptions(['none', 'low', 'medium', 'high'], null, '')}</select></label>
          </div>
          <p class="hint" aria-live="polite"></p>
        </fieldset>`).join('')}
        <button class="btn" type="submit">Enregistrer</button>
        <p class="status" aria-live="polite"></p>
      </section>
    </form></div>`;
  const on = $view.querySelector('[name=on]');
  const time = $view.querySelector('[name=time]');
  const btn = $view.querySelector('[data-run]');
  const status = $view.querySelector('.status');
  const form = $view.querySelector('.ai-config');
  const saved = form.querySelector('.status');
  const call = async (path, payload) => {
    const res = await fetch(path, { method: payload ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: payload && JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    return data;
  };
  const show = (s) => {
    const ready = !!(s.tasks.recommend.url || s.defaults.url);
    on.checked = s.on;
    time.value = s.time;
    on.disabled = time.disabled = btn.disabled = !ready || s.thinking;
    btn.textContent = s.thinking ? "L'IA réfléchit…" : 'Lancer maintenant';
    status.textContent = !ready ? "Renseigne d'abord la route du serveur d'IA plus bas."
      : s.thinking ? "L'IA est en train de chercher, ça prend environ une minute."
      : [s.on ? `Prochaine fois : ${when(s.next)}.` : 'Désactivé : coche la case pour un lancement chaque jour.',
        !s.at ? 'Pas encore lancé.'
        : `Dernière fois : ${when(s.at)}, ` + (s.error ? `échec : ${s.error}` : `${s.picks} titres choisis dans ta médiathèque, ${s.discover} à découvrir.`),
      ].join(' ');
  };
  // "aujourd'hui à 04:00", "demain à 04:00", else the date.
  const when = (t) => {
    const d = new Date(t);
    const day = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5);
    const hour = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    return `${{ '-1': 'hier', 0: "aujourd'hui", 1: 'demain' }[day] ?? d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })} à ${hour}`;
  };
  // Models of a route, offered in the field's list; also tells right away if the route answers.
  const models = async (box) => {
    const hint = box.querySelector('.hint');
    const url = box.querySelector('[name=url]').value.trim();
    hint.textContent = 'Connexion au serveur…';
    try {
      const model = box.querySelector('[name=model]');
      const effort = box.querySelector('[name=effort]');
      const { models: list, current, efforts, defaultEffort } = await call('/api/ai/models', {
        task: box.dataset.task, url, key: box.querySelector('[name=key]').value, model: model.value.trim(),
      });
      box.querySelector('datalist').innerHTML = list.map((m) => `<option value="${esc(m)}">`).join('');
      if (!model.value && current) model.value = current; // pre-filled with what the server runs now
      effort.innerHTML = effortOptions(efforts, defaultEffort, effort.value);
      hint.textContent = list.length ? `Serveur joignable : ${list.length} modèle${list.length > 1 ? 's' : ''} proposé${list.length > 1 ? 's' : ''} dans le champ Modèle.` : 'Serveur joignable, mais il ne liste aucun modèle.';
    } catch (e) {
      hint.textContent = e.message;
    }
  };
  const fill = (s) => {
    for (const box of form.querySelectorAll('fieldset')) {
      const t = s.tasks[box.dataset.task];
      box.querySelector('[name=url]').value = t.url || s.defaults.url;
      box.querySelector('[name=url]').placeholder = s.defaults.url || 'http://192.168.1.89:8080/v1';
      box.querySelector('[name=model]').value = t.model || s.defaults.model;
      box.querySelector('[name=model]').placeholder = s.defaults.model || 'Celui chargé sur le serveur';
      box.querySelector('[name=key]').value = '';
      box.querySelector('[name=key]').placeholder = t.hasKey ? 'Enregistrée (laisse vide pour la garder)' : 'Aucune';
      const effort = box.querySelector('[name=effort]');
      if (![...effort.options].some((o) => o.value === t.effort)) effort.add(new Option(EFFORT_NAMES[t.effort] || t.effort, t.effort));
      effort.value = t.effort;
    }
  };

  let s;
  try {
    s = await call('/api/settings');
  } catch (e) {
    status.textContent = e.message || 'Nimbus ne répond pas.';
    return;
  }
  show(s);
  fill(s);
  form.querySelectorAll('fieldset').forEach((box) => {
    models(box);
    box.querySelector('[name=url]').onchange = () => models(box);
    box.querySelector('[name=model]').onchange = () => models(box); // another model may accept other levels
  });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const tasks = Object.fromEntries([...form.querySelectorAll('fieldset')].map((box) => [box.dataset.task, {
      url: box.querySelector('[name=url]').value, model: box.querySelector('[name=model]').value,
      key: box.querySelector('[name=key]').value, effort: box.querySelector('[name=effort]').value,
    }]));
    try {
      const next = await call('/api/settings', { tasks });
      fill(next);
      show(next);
      saved.textContent = 'Enregistré.';
    } catch (err) {
      saved.textContent = err.message;
    }
  };
  const save = () => call('/api/settings', { on: on.checked, time: time.value })
    .then((next) => { show(next); status.textContent = `Enregistré. ${status.textContent}`; })
    .catch((e) => (status.textContent = e.message));
  on.onchange = save;
  time.onchange = () => time.value && save();
  btn.onclick = async () => {
    show({ ...(await call('/api/settings')), thinking: true });
    try {
      show(await call('/api/recommend', {}));
    } catch (e) {
      show(await call('/api/settings').catch(() => ({ ...s, error: e.message, at: Date.now() })));
    }
  };
}

route();
</script>
</body>
</html>
